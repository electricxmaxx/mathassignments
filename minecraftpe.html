<!doctype html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubblfan/mcpeweb@latest/">

  <link
    href="https://cdn.jsdelivr.net/gh/bubblfan/mcpeweb@latest/manifest.json"
    rel="manifest"
  >

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    canvas.emscripten {
      display: block;
      outline: 0;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <canvas
    class="emscripten"
    id="canvas"
    oncontextmenu="event.preventDefault()"
    tabindex="-1"
  ></canvas>

  <script>
    var Module = {
      canvas: document.getElementById("canvas")
    };

    !function() {
      var e = document.getElementById("canvas");

      e.addEventListener("mousedown", function(t) {
        !t.isTrusted ||
        document.pointerLockElement ||
        window.mcMenuOpen ||
        e.requestPointerLock();
      });

      e.addEventListener("touchstart", function(e) {
        e.preventDefault();
      }, {
        passive: false
      });

      document.addEventListener("touchstart", function(e) {
        var t = e.target.tagName;

        if (
          t !== "INPUT" &&
          t !== "TEXTAREA" &&
          t !== "BUTTON" &&
          t !== "SELECT" &&
          t !== "OPTION"
        ) {
          e.preventDefault();
        }
      }, {
        passive: false
      });
    }();
  </script>

  <script>
    "serviceWorker" in navigator &&
    window.addEventListener("load", function() {
      navigator.serviceWorker.register(
        "https://cdn.jsdelivr.net/gh/bubblfan/mcpeweb@latest/sw.js"
      ).then(function(e) {
        console.log("ServiceWorker registration successful:", e.scope);
      }).catch(function(e) {
        console.log("ServiceWorker registration failed:", e);
      });
    });
  </script>

  <script
    async
    src="https://cdn.jsdelivr.net/gh/bubblfan/mcpeweb@latest/index.js"
  ></script>
</body>
</html>
