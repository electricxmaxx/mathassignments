    <canvas id="game" tabindex="0"></canvas>
    <div id="port-credits">
        <a href="https://apollo44.lat" target="_blank" rel="noopener noreferrer">ported by apollo (u5sk on discord)</a>
        <a href="https://ivy.rest" target="_blank" rel="noopener noreferrer">an ivy webport</a>
    </div>
    <div id="loading">
        <span id="status">loading lobotomy corporation</span>
        <progress id="progress" max="1" value="0"></progress>
    </div>
    <script>
        (async () => {
            const screen = document.getElementById('loading')
              , status = document.getElementById('status')
              , bar = document.getElementById('progress')
              , canvas = document.getElementById('game');
            const urls = [];
            try {
                const response = await fetch('https://cdn.jsdelivr.net/gh/3cfl/lobotomy-webport@967ba24f9e24e627d62b0a6fb5775163ca3233df/manifest.json');
                if (!response.ok)
                    throw Error('manifest download failed');
                const manifest = await response.json();
                const entries = Object.entries(manifest.files).filter( ([name]) => !name.startsWith('StreamingAssets/'));
                const total = entries.reduce( (sum, [,file]) => sum + file.parts.reduce( (size, part) => size + part.size, 0), 0);
                let loaded = 0;
                async function download(part, signal) {
                    let error;
                    for (let attempt = 0; attempt < 3 && !signal.aborted; attempt++) {
                        try {
                            const result = await fetch(part.url, {
                                signal: AbortSignal.any([signal, AbortSignal.timeout(90000)])
                            });
                            if (!result.ok)
                                throw Error('asset download failed: ' + result.status);
                            const bytes = await result.arrayBuffer();
                            if (bytes.byteLength !== part.size)
                                throw Error('asset size mismatch');
                            const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), b => b.toString(16).padStart(2, '0')).join('');
                            if (hash !== part.sha256)
                                throw Error('asset integrity check failed');
                            loaded += bytes.byteLength;
                            bar.value = loaded / total;
                            status.textContent = 'loading ' + Math.floor(100 * loaded / total) + '%';
                            return new Uint8Array(bytes);
                        } catch (caught) {
                            error = caught
                        }
                    }
                    throw signal.aborted ? signal.reason : error;
                }
                const assets = {};
                for (const [name,file] of entries) {
                    const type = name.endsWith('.wasm') ? 'application/wasm' : name.endsWith('.js') ? 'text/javascript' : 'application/octet-stream';
                    const abort = new AbortController();
                    let index = 0;
                    let stream = new ReadableStream({
                        async pull(controller) {
                            if (index === file.parts.length) {
                                controller.close();
                                return
                            }
                            controller.enqueue(await download(file.parts[index++], abort.signal));
                        },
                        cancel(reason) {
                            abort.abort(reason)
                        }
                    });
                    if (file.encoding === 'gzip')
                        stream = stream.pipeThrough(new DecompressionStream('gzip'));
                    const blob = await new Response(stream,{
                        headers: {
                            'Content-Type': type
                        }
                    }).blob();
                    if (blob.size !== file.size)
                        throw Error('decompressed asset size mismatch');
                    assets[name] = URL.createObjectURL(blob);
                    urls.push(assets[name]);
                }
                const find = suffix => {
                    const key = Object.keys(assets).find(name => name.endsWith(suffix));
                    if (!key)
                        throw Error('missing ' + suffix);
                    return assets[key]
                }
                ;
                await new Promise( (resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = find('.loader.js');
                    script.onload = resolve;
                    script.onerror = () => reject(Error('game loader failed'));
                    document.head.append(script)
                }
                );
                status.textContent = 'starting game';
                window.ivyGame = await createUnityInstance(canvas, {
                    devicePixelRatio: 1,
                    dataUrl: find('.data'),
                    frameworkUrl: find('.framework.js'),
                    codeUrl: find('.wasm'),
                    streamingAssetsUrl: manifest.streamingAssetsBase,
                    companyName: 'Project_Moon',
                    productName: 'Lobotomy Corporation',
                    productVersion: 'ivy-webport'
                }, progress => {
                    bar.value = progress
                }
                );
                screen.remove();
                canvas.focus();
                let titleClicks = 0;
                canvas.addEventListener('click', () => {
                    if (++titleClicks === 2)
                        document.getElementById('port-credits')?.remove()
                }
                );
                for (const url of urls)
                    URL.revokeObjectURL(url);
            } catch (error) {
                for (const url of urls)
                    URL.revokeObjectURL(url);
                status.textContent = error.message;
                const retry = document.createElement('button');
                retry.textContent = 'retry';
                retry.onclick = () => location.reload();
                screen.append(retry);
                console.error(error)
            }
        }
        )();
    </script>
