
<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/Pok12d/ta@main/tungobby/">

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
    }

    #unity-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    #unity-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #unity-game-title {
      position: absolute;
      z-index: 3;
      top: 35%;
      width: 100%;
      text-align: center;
      pointer-events: none;
    }

    #unity-loading-bar {
      position: absolute;
      z-index: 4;
      width: min(60%, 400px);
      left: 50%;
      top: 55%;
      transform: translateX(-50%);
    }

    #unity-loading-text {
      position: absolute;
      z-index: 4;
      top: calc(55% + 25px);
      width: 100%;
      text-align: center;
      color: white;
    }

    #unity-warning {
      position: absolute;
      z-index: 10;
      top: 0;
      width: 100%;
    }

    #unity-footer {
      display: none;
    }

    #orientation-warning {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #111;
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 18px;
      padding: 20px;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="unity-container">

    <canvas id="unity-canvas"></canvas>

    <div id="unity-preview">
      <img src="TemplateData/preview.png" alt="Preview">
    </div>

    <div id="unity-game-title">
      <div class="line-1">Tung Tung Sahur</div>
      <div class="line-2">Obby Challenge</div>
    </div>

    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-loading-text">Loading</div>
    <div id="unity-warning"></div>
    <div id="unity-footer"></div>

  </div>

  <div id="orientation-warning">
    <img src="TemplateData/rotate-device.png"
         alt="Rotate Device"
         style="width:150px; margin-bottom:20px;">

    Please rotate your device to
    <strong>landscape mode</strong> and reload the game.
  </div>

  <script>
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const progressBarFull = document.getElementById("unity-progress-bar-full");
    const loadingText = document.getElementById("unity-loading-text");
    const warningBanner = document.getElementById("unity-warning");
    const gameTitle = document.getElementById("unity-game-title");
    const unityPreview = document.getElementById("unity-preview");
    const orientationWarning = document.getElementById("orientation-warning");

    let unityInstance = null;

    function updateLoadingText(progress) {
      loadingText.innerText =
        "Loading " + Math.round(progress * 100) + "%";
    }

    function unityShowBanner(msg, type) {
      const div = document.createElement("div");
      div.innerHTML = msg;

      if (type === "error") {
        div.style = "background:red;padding:10px;";
      } else {
        div.style = "background:yellow;padding:10px;";
      }

      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => div.remove(), 5000);
      }
    }

    const buildUrl = "Build";

    const loaderUrl =
      buildUrl + "/TungTungSahur-ObbyChallenge-v.1.1.loader.js";

    const config = {
      dataUrl:
        buildUrl + "/TungTungSahur-ObbyChallenge-v.1.1.data.unityweb",

      frameworkUrl:
        buildUrl + "/TungTungSahur-ObbyChallenge-v.1.1.framework.js.unityweb",

      codeUrl:
        buildUrl + "/TungTungSahur-ObbyChallenge-v.1.1.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",

      companyName: "Nexus",
      productName: "Tung Tung Sahur: Obby Challenge",
      productVersion: "0.1",

      showBanner: unityShowBanner,

      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    function checkOrientation() {
      const isPortrait = window.innerHeight > window.innerWidth;

      const isMobile =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile && isPortrait) {
        orientationWarning.style.display = "flex";
        container.style.display = "none";
      } else {
        orientationWarning.style.display = "none";
        container.style.display = "block";
      }
    }

    function resizeGame() {
      checkOrientation();

      if (unityInstance) {
        unityInstance.SendMessage(
          "Canvas",
          "OnResize"
        );
      }
    }

    window.addEventListener("resize", resizeGame);

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        resizeGame();
      }, 300);
    });

    window.addEventListener("load", checkOrientation);

    // Load Unity
    const script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          progressBarFull.style.width =
            (100 * progress) + "%";

          updateLoadingText(progress);
        }
      ).then((instance) => {

        unityInstance = instance;

        loadingBar.style.display = "none";
        unityPreview.style.display = "none";
        loadingText.style.display = "none";
        gameTitle.style.display = "none";

        resizeGame();

      }).catch((message) => {
        alert(message);
      });
    };

    script.onerror = () => {
      alert("Failed to load the Unity game loader.");
    };

    document.body.appendChild(script);

  </script>

</body>
</html>
